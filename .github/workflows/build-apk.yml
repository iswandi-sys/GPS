name: Build Android APK - NAVIGASI LAUT SR

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Capacitor Core & Android
        run: |
          npm install --save @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli
          npx cap init "NAVIGASI LAUT SR" "com.navigasilaut.sr" --web-dir dist
          npx cap add android

      - name: Configure Android Permissions in AndroidManifest.xml
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' "$MANIFEST_PATH"

      - name: Sync Web Build to Native Android
        run: |
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copy and Rename APK Output
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/NavigasiLautSR-v1.0.0.apk
          ls -lh release-apk/NavigasiLautSR-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NavigasiLautSR-Android-APK
          path: release-apk/NavigasiLautSR-v1.0.0.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-release-${{ github.run_number }}
          name: "NAVIGASI LAUT SR - Unduh APK Nelayan v1.0.0"
          body: |
            ## 🚢 NAVIGASI LAUT SR - APK Android Siap Pasang

            Aplikasi navigasi maritim offline khusus nelayan wilayah perairan Sulawesi, Nusa Tenggara, dan sekitarnya.

            ### 📥 Tautan Unduh Berkas APK:
            Unduh file **NavigasiLautSR-v1.0.0.apk** di bawah ini dan pasang pada HP Android Anda.

            ### ✨ Fitur Unggulan:
            - **Navigasi GPS Maritim:** Kecepatan (Knot), Haluan (COG), Arah Target (Bearing), Selisih Sudut Kemudi, dan Jarak (NMi).
            - **Peta Offline Nyata:** Sistem penyimpanan tile lokal mandiri di memori HP untuk perairan Sulawesi & Nusa Tenggara.
            - **Explorer Mode:** HUD kontras tinggi layar penuh dengan angka besar yang terbaca di bawah terik matahari laut.
            - **Titik Saya:** Tandai rumpon, karang dangkal, pelabuhan, dan spot ikan dengan foto kamera & koordinat DD/DMS.
            - **Cuaca Laut Maritim:** Tinggi & arah gelombang, kecepatan angin, suhu air laut, dan prakiraan 3 hari tersimpan offline.
            - **Panduan Suara Kemudi Nelayan:** Koreksi arah haluan kapal otomatis dalam Bahasa Indonesia.
            - **Berbagi Lokasi Tanpa Server:** Ekspor & impor file GPX 1.1, GeoJSON, dan JSON.
          files: release-apk/NavigasiLautSR-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
